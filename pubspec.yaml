name: animate_kit
description: >-
  State-driven Flutter animation primitives built on flutter_animate.
  Respects system reduce-motion. Includes entrance, opacity, surface, and
  skeleton shimmer widgets.
version: 0.4.0
repository: https://github.com/RanveerSingh1997/animate_kit
issue_tracker: https://github.com/RanveerSingh1997/animate_kit/issues
topics:
  - animation
  - ui
  - skeleton
  - shimmer
  - loading

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2

dev_dependencies:
  dart_code_linter: ^3.1.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
